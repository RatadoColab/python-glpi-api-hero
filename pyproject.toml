[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "GlpiApiHero"
version = "0.1.0"
description = "Python client to easly communication with GLPI REST API."
authors = [
    { name = "André Proto" },
    { name = "Leonardo Fernandes da Silva" }
]
keywords = ["GLPI", "ITSM", "helpdesk", "API", "REST", "client"]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "glpi_api>=0.7.0"
]

[project.optional-dependencies]
dashboard = ["plotly>=5.0.0", "kaleido>=1.0.0"]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.6", "build>=1.2", "pip-audit>=2.7"]
# Temporary: pins the characterization oracle to glpi-api (removed with the core dependency in phase 02)
characterization = ["glpi-api>=0.7.0"]

[project.urls]
Homepage = "https://github.com/RatadoColab/python-glpi-api-hero"
Repository = "https://github.com/RatadoColab/python-glpi-api-hero"
Issues = "https://github.com/RatadoColab/python-glpi-api-hero/issues"
Changelog = "https://github.com/RatadoColab/python-glpi-api-hero/blob/main/CHANGELOG.md"


[tool.setuptools.packages.find]
where = ["src"]

# [project.scripts]
# python-glpi-api-hero = "python-glpi-api-hero.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["src/glpi_api_hero/glpi_api.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Legacy modules kept as they are until phases 02 and 04.1 (no production change in phase 01)
"src/glpi_api_hero/__init__.py" = ["I001", "W292"]
