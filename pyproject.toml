[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "GlpiApiHero"
version = "0.1.0"
description = "Python client to easly communication with GLPI REST API."
authors = [
    { name = "André Proto" },
    { name = "Leonardo Fernandes da Silva" }
]
keywords = ["GLPI", "ITSM", "helpdesk", "API", "REST", "client"]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "requests>=2.32.4"
]

[project.optional-dependencies]
dashboard = ["plotly>=5.0.0", "kaleido>=1.0.0"]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.6", "build>=1.2", "pip-audit>=2.7"]

[project.urls]
Homepage = "https://github.com/RatadoColab/python-glpi-api-hero"
Repository = "https://github.com/RatadoColab/python-glpi-api-hero"
Issues = "https://github.com/RatadoColab/python-glpi-api-hero/issues"
Changelog = "https://github.com/RatadoColab/python-glpi-api-hero/blob/main/CHANGELOG.md"


[tool.setuptools.packages.find]
where = ["src"]

# [project.scripts]
# python-glpi-api-hero = "python-glpi-api-hero.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# Legacy camelCase names kept until phase 04.1; dashboard moves to examples/ in phase 04.2
"src/glpi_api_hero/api_communication.py" = ["N802"]
"src/glpi_api_hero/computer.py" = ["N802"]
"src/glpi_api_hero/group.py" = ["N802"]
"src/glpi_api_hero/location.py" = ["N802"]
"src/glpi_api_hero/ticket.py" = ["N802"]
"src/glpi_api_hero/user.py" = ["N802"]
"src/glpi_api_hero/ticket_dashboard.py" = ["B904", "B905"]
